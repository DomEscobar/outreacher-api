[supervisord]
nodaemon=true
logfile=/opt/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/opt/data/logs
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
[program:desktop]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec openbox'
priority=20
autorestart=true
[program:browser]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec python3 /opt/browser-box/browser_runner.py'
priority=30
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=20
[program:terminal]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec xterm -title Hermes -geometry 95x22+15+520 -e /bin/bash'
priority=30
autorestart=true
[program:vnc]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec /usr/bin/X0tigervnc -display :99 -localhost -rfbport 5900 -SecurityTypes None -AlwaysShared=1 -UseBlacklist=0'
priority=40
autorestart=true
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=50
autorestart=true

[program:discovery-api]
directory=/opt/browser-box/discovery-api
command=/opt/hermes/.venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port 8081 --workers 1 --no-access-log --log-level warning
priority=60
environment=HERMES_HOME="/opt/data",DISCOVERY_DATA_DIR="/opt/data/discovery-api",DISCOVERY_HERMES_EXECUTABLE="/opt/browser-box/discovery-api/hermes_discovery.py"
autorestart=unexpected
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/data/discovery-api/service.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/opt/data/discovery-api/service.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
